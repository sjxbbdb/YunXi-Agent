[workspace]
members = [
    "crates/yunxi-agent-core",
    "crates/yunxi-agent-codex",
    "crates/yunxi-agent-cli",
]
resolver = "2"
exclude = ["external/codex-rs"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
predicates = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }

[patch.crates-io]
# Required by upstream Codex crates when the codex-native feature is enabled.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
