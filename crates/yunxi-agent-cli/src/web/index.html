<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YunXi Agent Web</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="scene-backdrop" aria-hidden="true">
      <div class="room-blur room-blur-a"></div>
      <div class="room-blur room-blur-b"></div>
      <div class="room-blur room-blur-c"></div>
      <div class="glass-haze"></div>
    </div>

    <header class="top-dock" aria-label="YunXi Agent navigation">
      <nav class="dock-shell" id="yunxi-dock" aria-label="主导航">
        <button
          class="dock-item is-active"
          type="button"
          data-nav="chat"
          data-label="聊天"
          aria-label="聊天"
          aria-current="page"
        >
          <svg class="dock-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path>
          </svg>
        </button>
        <button
          class="dock-item"
          type="button"
          data-nav="memory"
          data-label="记忆"
          aria-label="记忆"
        >
          <svg class="dock-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"></path>
            <path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"></path>
          </svg>
        </button>
        <button
          class="dock-item"
          type="button"
          data-nav="persona"
          data-label="人格"
          aria-label="人格"
        >
          <svg class="dock-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="10" r="3"></circle>
            <path d="M6.2 20a6 6 0 0 1 11.6 0"></path>
          </svg>
        </button>
        <button
          class="dock-item"
          type="button"
          data-nav="mailbox"
          data-label="信箱"
          aria-label="信箱"
        >
          <svg class="dock-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="m3 7 9 6 9-6"></path>
          </svg>
        </button>
      </nav>
    </header>

    <main class="app-stage">
      <section class="view view-chat is-active" id="view-chat" data-view="chat">
        <div class="chat-canvas">
          <section class="chat-hero" aria-labelledby="chat-title">
            <h1 id="chat-title">YunXi Agent</h1>
            <p class="chat-subtitle">
              和你一起想清楚，也一起做完。
            </p>
            <div class="runtime-strip" id="runtime-strip" aria-live="polite">
              正在读取运行状态
            </div>
          </section>

          <section class="chat-panel" aria-label="聊天">
            <div class="chat-log" id="chat-log" aria-live="polite"></div>
            <form class="composer" id="composer">
              <textarea
                id="prompt"
                rows="1"
                placeholder="和 YunXi 说点什么..."
                autocomplete="off"
              ></textarea>
              <div class="composer-row">
                <span class="composer-hint">Enter 发送，Shift + Enter 换行</span>
                <button class="send-button" id="send-button" type="submit" aria-label="发送">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m18 15-6-6-6 6"></path>
                  </svg>
                </button>
              </div>
            </form>
          </section>
        </div>
      </section>

      <section class="view view-memory" id="view-memory" data-view="memory" hidden>
        <div class="memory-canvas">
          <section class="memory-head" aria-labelledby="memory-title">
            <h1 id="memory-title">长期记忆</h1>
          </section>

          <section
            class="memory-field"
            id="memory-field"
            aria-label="长期记忆气泡"
            aria-live="polite"
          >
            <div class="empty-state">正在读取长期记忆</div>
          </section>
        </div>

        <aside
          class="memory-reveal"
          id="memory-reveal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="memory-detail-title"
          hidden
          aria-live="polite"
        >
          <button class="close-reveal" id="memory-close" type="button" aria-label="关闭记忆详情">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
          <div class="memory-spread" id="memory-spread"></div>
          <article class="memory-detail-card">
            <p class="detail-kicker" id="memory-detail-kind">Memory</p>
            <h2 id="memory-detail-title">记忆详情</h2>
            <p id="memory-detail-content"></p>
            <dl class="detail-grid" id="memory-detail-meta"></dl>
          </article>
        </aside>
      </section>

      <section class="view view-persona" id="view-persona" data-view="persona" hidden>
        <div class="persona-canvas">
          <h1 class="visually-hidden" id="persona-title">人格档案</h1>

          <section class="persona-stage" aria-label="人格卡片">
            <button class="persona-arrow" id="persona-prev" type="button" aria-label="上一张人格卡">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <div class="persona-deck" id="persona-deck" aria-live="polite">
              <div class="empty-state">正在读取人格档案</div>
            </div>
            <button class="persona-arrow" id="persona-next" type="button" aria-label="下一张人格卡">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </button>
          </section>

          <section
            class="persona-detail"
            id="persona-detail"
            role="dialog"
            aria-modal="true"
            aria-labelledby="persona-detail-title"
            hidden
            aria-live="polite"
          >
            <button class="persona-detail-close" id="persona-detail-close" type="button" aria-label="收起人格详情">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
            <div class="persona-detail-layout">
              <aside class="persona-detail-rail" aria-label="人格层概览">
                <p class="detail-kicker" id="persona-detail-kicker">人格层</p>
                <h2 id="persona-detail-title">人格详情</h2>
                <p class="persona-detail-summary" id="persona-detail-summary">当前会影响回复的稳定设定</p>
              </aside>
              <article class="persona-detail-reading" aria-label="人格层详情">
                <p class="persona-detail-reading-label">人格原文</p>
                <p id="persona-detail-content"></p>
              </article>
            </div>
          </section>
        </div>
      </section>

      <section class="view view-mailbox" id="view-mailbox" data-view="mailbox" hidden>
        <div class="mailbox-canvas">
          <header class="mailbox-head" aria-labelledby="mailbox-title">
            <div>
              <h1 id="mailbox-title">陪伴信箱</h1>
              <p class="mailbox-count" id="mailbox-count" aria-live="polite">正在读取信件</p>
            </div>
            <button class="mailbox-refresh" id="mailbox-refresh" type="button" aria-label="刷新信箱" title="刷新信箱">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
                <path d="M20 4v6h-6"></path>
              </svg>
            </button>
          </header>

          <section class="mailbox-list" id="mailbox-list" aria-label="信件列表" aria-live="polite" aria-busy="true">
            <div class="mailbox-loading" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </section>
        </div>

        <aside
          class="mailbox-detail"
          id="mailbox-detail"
          role="dialog"
          aria-modal="true"
          aria-labelledby="mailbox-detail-title"
          hidden
        >
          <button class="mailbox-detail-close" id="mailbox-detail-close" type="button" aria-label="关闭信件">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
          <article class="mailbox-letter" id="mailbox-letter">
            <p class="mailbox-letter-kicker">来自 YunXi</p>
            <h2 id="mailbox-detail-title">一封信</h2>
            <p class="mailbox-letter-date" id="mailbox-letter-date"></p>
            <div class="mailbox-letter-body" id="mailbox-letter-body"></div>
            <footer class="mailbox-letter-actions">
              <span id="mailbox-letter-state">未读</span>
              <button class="mailbox-archive" id="mailbox-archive" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 7v13h16V7"></path>
                  <path d="M3 3h18v4H3z"></path>
                  <path d="M9 11h6"></path>
                </svg>
                <span>归档</span>
              </button>
            </footer>
          </article>
        </aside>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
