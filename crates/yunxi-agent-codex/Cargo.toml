[package]
name = "yunxi-agent-codex"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
codex-native = [
    "dep:codex-exec",
    "dep:codex-arg0",
    "dep:rama-error",
    "dep:rama-utils",
]
process-fallback = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
yunxi-agent-core = { path = "../yunxi-agent-core" }
codex-exec = { path = "../../external/codex-rs/exec", optional = true }
codex-arg0 = { path = "../../external/codex-rs/arg0", optional = true }
rama-error = { version = "=0.3.0-alpha.4", optional = true }
rama-utils = { version = "=0.3.0-alpha.4", optional = true }

[dev-dependencies]
tempfile.workspace = true
